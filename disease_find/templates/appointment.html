<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HealthCare Center</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- HEADER -->
<header id="header">
    <div class="logo">
        <span class="logo-icon">🏥</span>
        <span class="logo-text">HealthCare Center</span>
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="/appointment">Appointment</a>
        <a href="/contact">Contact</a>
        <a href="/signin">
            <button class="disease-btn">🦠 Find Disease</button>
        </a>
    </nav>
</header>

<!-- APPOINTMENT FORM -->
<section style="margin-top:100px;">
    <div class="web-form-container">
        <h2>Book an Appointment</h2>

        <form action="/book" method="POST">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label>Select Department</label>
                <select name="department" required>
                    <option value="">-- Choose Department --</option>
                    <option>General Physician</option>
                    <option>Cardiology</option>
                    <option>Pediatrics</option>
                    <option>Orthopedics</option>
                </select>
            </div>

            <div class="form-group">
                <label>Select Doctor</label>
                <select name="doctor" required>
                    <option value="">-- Choose Doctor --</option>
                    <option>Dr. Amit Sharma</option>
                    <option>Dr. Neha Verma</option>
                    <option>Dr. Rahul Mehta</option>
                </select>
            </div>

            <div class="form-group">
                <label>Appointment Date</label>
                <input type="date" name="date" required>
            </div>

            <div class="form-group">
                <label>Appointment Time</label>
                <input type="time" name="time" required>
            </div>

            <div class="form-group">
                <label>Message (Optional)</label>
                <textarea name="message" rows="3" placeholder="Any additional info..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Confirm Appointment</button>

        </form>
    </div>
</section>

<!-- FOOTER -->
<footer>
    <p>© 2026 HealthCare Hospital | All Rights Reserved</p>
</footer>

</body>
</html>
